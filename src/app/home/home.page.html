<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Harcama Takip</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <!-- Harcama Ekleme Formu -->
  <ion-card>
    <ion-card-content>
      <ion-input label="Harcama Adı" labelPlacement="floating" [(ngModel)]="expenseName" type="text"></ion-input>
      
      <ion-input label="Tutar (₺)" labelPlacement="floating" [(ngModel)]="expenseAmount" type="number"></ion-input>
      
      <ion-select label="Kategori" labelPlacement="floating" [(ngModel)]="expenseCategory">
        <ion-select-option value="Market">Market</ion-select-option>
        <ion-select-option value="Ulaşım">Ulaşım</ion-select-option>
        <ion-select-option value="Fatura">Fatura</ion-select-option>
        <ion-select-option value="Eğlence">Eğlence</ion-select-option>
      </ion-select>

      <ion-button expand="block" class="ion-margin-top" (click)="addExpense()">
        Harcama Ekle
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Toplam Harcama Gösterimi -->
  <ion-card color="light">
    <ion-card-content class="ion-text-center">
      <h2>Toplam Harcama</h2>
      <h1><strong>{{ getTotal() }} ₺</strong></h1>
    </ion-card-content>
  </ion-card>

  <!-- Harcama Listesi ve Sliding (Kaydırarak Silme) -->
  <ion-list>
    <ion-item-sliding *ngFor="let item of expenses">
      
      <!-- Liste Elemanı -->
      <ion-item>
        <ion-label>
          <!-- Kategori Rengi Bonusu BURADA DÜZELTİLDİ -->
          <h2><ion-text [color]="getCategoryColor(item.category)">{{ item.name }}</ion-text></h2>
          <p>{{ item.category }} | {{ item.date }}</p>
        </ion-label>
        <ion-note slot="end" color="danger" style="font-weight: bold; font-size: 16px;">
          -{{ item.amount }} ₺
        </ion-note>
      </ion-item>

      <!-- Kaydırınca Çıkan Silme Butonu -->
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmDelete(item.id)">
          Sil
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
